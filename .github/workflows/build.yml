name: Build APK

# Otomatis jalan tiap push ke main/master, atau manual lewat tab Actions -> Run workflow.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Tidak butuh gradle wrapper di repo: Gradle dipasang oleh action ini (cache otomatis).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit test + build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DompetkuDemo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
